<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brainrot du jour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #2a1fd6;
    --bg-deep: #1a1297;
    --paper: #fff8e7;
    --ink: #170f4d;
    --pink: #ff4fa3;
    --yellow: #ffe14a;
    --mint: #3be8b0;
    --radius: 28px;
    --display: "Bagel Fat One", "Arial Black", Impact, sans-serif;
    --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { background: var(--bg-deep); }

  body {
    min-height: 100vh;
    font-family: var(--body);
    color: var(--paper);
    background:
      radial-gradient(circle at 15% 10%, #4a3dff 0, transparent 40%),
      radial-gradient(circle at 90% 85%, #6a1fd6 0, transparent 45%),
      var(--bg);
    padding: 24px 16px 64px;
  }

  .wrap { max-width: 980px; margin: 0 auto; }

  header { text-align: center; padding: 8px 0 28px; }

  h1 {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(2.6rem, 9vw, 5.5rem);
    line-height: .95;
    color: var(--yellow);
    text-shadow: 4px 4px 0 var(--pink), 8px 8px 0 var(--ink);
    transform: rotate(-2deg);
    display: inline-block;
  }

  .date {
    margin-top: 22px;
    font-size: 1.05rem;
    font-weight: 500;
    opacity: .9;
    text-transform: capitalize;
  }

  /* ---------- Carte principale ---------- */
  .card {
    background: var(--paper);
    color: var(--ink);
    border: 5px solid var(--ink);
    border-radius: var(--radius);
    box-shadow: 10px 10px 0 var(--ink);
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
    overflow: hidden;
  }

  .stage {
    position: relative;
    min-height: 380px;
    display: grid;
    place-items: center;
    background: var(--stage, var(--pink));
    border-right: 5px solid var(--ink);
    overflow: hidden;
    transition: background .4s;
  }

  .stage::before {
    content: "";
    position: absolute;
    inset: -50%;
    background: repeating-conic-gradient(rgba(255,255,255,.18) 0 10deg, transparent 10deg 20deg);
    animation: rays 40s linear infinite;
  }

  .shadow {
    position: absolute;
    bottom: 56px;
    width: 140px;
    height: 22px;
    border-radius: 50%;
    background: rgba(23, 15, 77, .35);
    animation: shadow 1.2s ease-in-out infinite;
  }

  .avatar {
    position: relative;
    font-size: clamp(7rem, 22vw, 11rem);
    line-height: 1;
    user-select: none;
    cursor: pointer;
    filter: drop-shadow(0 8px 0 rgba(23,15,77,.25));
  }

  .avatar:focus-visible { outline: 4px dashed var(--ink); outline-offset: 12px; border-radius: 20px; }

  .avatar.pop { animation: pop .5s cubic-bezier(.3, 1.8, .5, 1) !important; }

  .a-bounce { animation: bounce 1.2s ease-in-out infinite; }
  .a-wobble { animation: wobble 1.6s ease-in-out infinite; }
  .a-spin   { animation: spin 3.2s linear infinite; }
  .a-shake  { animation: shake .45s linear infinite; }
  .a-float  { animation: float 3s ease-in-out infinite; }
  .a-pulse  { animation: pulse 1s ease-in-out infinite; }

  @keyframes rays { to { transform: rotate(360deg); } }
  @keyframes shadow { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.6); opacity: .5; } }
  @keyframes bounce { 0%,100% { transform: translateY(0) scale(1.05, .95); } 50% { transform: translateY(-46px) scale(.96, 1.06); } }
  @keyframes wobble { 0%,100% { transform: rotate(-12deg); } 50% { transform: rotate(12deg); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes shake { 0% { transform: translate(3px, 1px) rotate(0); } 25% { transform: translate(-3px, -2px) rotate(-3deg); } 50% { transform: translate(2px, 3px) rotate(3deg); } 75% { transform: translate(-2px, 1px) rotate(-2deg); } 100% { transform: translate(3px, -2px) rotate(2deg); } }
  @keyframes float { 0%,100% { transform: translate(-14px, 8px) rotate(-4deg); } 50% { transform: translate(14px, -22px) rotate(4deg); } }
  @keyframes pulse { 0%,100% { transform: scale(.92); } 50% { transform: scale(1.18); } }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.5) rotate(-10deg); } 100% { transform: scale(1); } }

  .hint {
    position: absolute;
    bottom: 14px;
    left: 0; right: 0;
    text-align: center;
    font-size: .85rem;
    font-weight: 700;
    color: var(--ink);
    opacity: .75;
  }

  .info { padding: 32px 30px 30px; display: flex; flex-direction: column; gap: 16px; }

  .origin {
    align-self: flex-start;
    background: var(--mint);
    border: 3px solid var(--ink);
    border-radius: 999px;
    padding: 4px 14px;
    font-weight: 700;
    font-size: .9rem;
  }

  h2 {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(2rem, 5vw, 3rem);
    line-height: 1;
    letter-spacing: .01em;
  }

  .desc { font-size: 1.08rem; line-height: 1.55; max-width: 60ch; }

  .chaos { display: flex; align-items: center; gap: 12px; font-weight: 700; }
  .bolts { display: flex; gap: 4px; font-size: 1.4rem; }
  .bolts span.off { filter: grayscale(1); opacity: .25; }

  /* ---------- Notation ---------- */
  .rate {
    margin-top: 6px;
    padding-top: 18px;
    border-top: 4px dashed var(--ink);
  }

  .rate h3 { font-size: 1.05rem; margin-bottom: 10px; }

  .stars { display: flex; gap: 6px; }

  .star {
    appearance: none;
    border: 0;
    background: none;
    cursor: pointer;
    font-size: 2.6rem;
    line-height: 1;
    padding: 2px;
    color: #cfc7e8;
    -webkit-text-stroke: 2px var(--ink);
    transition: transform .15s, color .15s;
  }

  .star.on { color: var(--yellow); }
  .star:hover { transform: scale(1.25) rotate(-8deg); }
  .star:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; border-radius: 8px; }

  .verdict {
    margin-top: 8px;
    min-height: 1.6em;
    font-weight: 700;
    color: var(--ink);
  }

  .next {
    margin-top: 4px;
    font-size: .92rem;
    opacity: .75;
  }

  /* ---------- Historique ---------- */
  .history { margin-top: 44px; }

  .history h3 {
    font-family: var(--display);
    font-weight: 400;
    font-size: 1.7rem;
    color: var(--yellow);
    margin-bottom: 6px;
  }

  .stats { opacity: .9; margin-bottom: 16px; }

  .days {
    list-style: none;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
  }

  .day {
    background: var(--paper);
    color: var(--ink);
    border: 4px solid var(--ink);
    border-radius: 20px;
    box-shadow: 5px 5px 0 var(--ink);
    padding: 12px;
    text-align: center;
  }

  .day .e { font-size: 2.4rem; line-height: 1.2; }
  .day .n { font-weight: 700; font-size: .92rem; line-height: 1.2; margin-top: 4px; }
  .day .d { font-size: .8rem; opacity: .7; margin-top: 2px; text-transform: capitalize; }
  .day .r { margin-top: 6px; font-size: 1rem; letter-spacing: 1px; }
  .day .r.none { font-size: .8rem; opacity: .6; letter-spacing: 0; }

  footer { margin-top: 48px; text-align: center; font-size: .85rem; opacity: .7; }

  @media (max-width: 760px) {
    .card { grid-template-columns: 1fr; }
    .stage { border-right: 0; border-bottom: 5px solid var(--ink); min-height: 320px; }
    .info { padding: 24px 20px; }
    .star { font-size: 2.3rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Brainrot<br>du jour</h1>
    <p class="date" id="date"></p>
  </header>

  <main>
    <article class="card" aria-live="polite">
      <div class="stage" id="stage">
        <div class="shadow" id="shadow"></div>
        <div class="avatar" id="avatar" role="button" tabindex="0" aria-label="Fais réagir le personnage"></div>
        <p class="hint">Clique sur lui, il adore ça.</p>
      </div>

      <div class="info">
        <span class="origin" id="origin"></span>
        <h2 id="name"></h2>
        <p class="desc" id="desc"></p>
        <div class="chaos">
          <span>Niveau de chaos</span>
          <span class="bolts" id="bolts" aria-hidden="true"></span>
          <span class="sr" id="boltsText"></span>
        </div>

        <section class="rate" aria-labelledby="rate-title">
          <h3 id="rate-title">Ta note pour aujourd'hui</h3>
          <div class="stars" id="stars" role="radiogroup" aria-label="Note sur 5"></div>
          <p class="verdict" id="verdict"></p>
          <p class="next" id="next"></p>
        </section>
      </div>
    </article>
  </main>

  <section class="history">
    <h3>Les 7 derniers jours</h3>
    <p class="stats" id="stats"></p>
    <ol class="days" id="days"></ol>
  </section>

  <footer>Un nouveau brainrot chaque jour à minuit. Tes notes restent sur ton appareil.</footer>
</div>

<script>
/* ============================================================
   1. LA LISTE DES BRAINROTS  (ajoute les tiens ici !)
   anim : bounce | wobble | spin | shake | float | pulse
   chaos : de 1 à 5
   ============================================================ */
const BRAINROTS = [
  { name: "Tung Tung Tung Sahur", emoji: "🪵", anim: "shake",  color: "#ff9f43", chaos: 4,
    origin: "Italian brainrot",
    desc: "Un tronc de bois armé d'une batte de baseball qui réveille tout le quartier à l'heure du repas d'avant l'aube, en répétant son nom comme un tambour. Il ne dort jamais, et il sait où tu habites." },
  { name: "Ballerina Cappuccina", emoji: "☕", anim: "wobble", color: "#ff7ac8", chaos: 2,
    origin: "Italian brainrot",
    desc: "Une danseuse dont la tête est une tasse de cappuccino. Gracieuse, délicate, et complètement hypnotique : elle pirouette comme si de rien n'était pendant que le monde s'effondre autour." },
  { name: "Tralalero Tralala", emoji: "🦈", anim: "bounce", color: "#4cc9f0", chaos: 5,
    origin: "Italian brainrot",
    desc: "Un requin à trois pattes chaussé de baskets de marque, qui court plus vite que ta logique. Personne ne sait pourquoi il est si sûr de lui, mais personne n'ose le contredire." },
  { name: "Bombardiro Crocodilo", emoji: "🐊", anim: "float",  color: "#7bd389", chaos: 5,
    origin: "Italian brainrot",
    desc: "Moitié crocodile, moitié bombardier. Il survole la timeline en larguant des phrases absurdes avec un aplomb militaire. Un cours de géographie qui tourne très mal." },
  { name: "Brr Brr Patapim", emoji: "🌳", anim: "wobble", color: "#c9a66b", chaos: 3,
    origin: "Italian brainrot",
    desc: "Un être de la forêt au nez énorme, dont les pieds ont été volés à un humain. Il avance avec un air perpétuellement confus et un bruit qui reste en tête toute la journée." },
  { name: "Lirili Larila", emoji: "🐘", anim: "bounce", color: "#ffd166", chaos: 2,
    origin: "Italian brainrot",
    desc: "Un éléphant à tronc de cactus qui se balade dans le désert au rythme d'une petite mélodie. Quand l'horloge qu'il porte se met à jouer, le temps devient très flexible." },
  { name: "Chimpanzini Bananini", emoji: "🍌", anim: "spin",   color: "#fff275", chaos: 4,
    origin: "Italian brainrot",
    desc: "Un chimpanzé dont le corps est une banane, qui tourne sur lui-même sans jamais se fatiguer. Il a un cousin, un autre cousin, et leur arbre généalogique est un incident diplomatique." },
  { name: "Trippi Troppi", emoji: "🦐", anim: "pulse",  color: "#ff8c69", chaos: 3,
    origin: "Italian brainrot",
    desc: "Un chat à corps de crevette. Voilà, c'est tout, et pourtant c'est impossible de détourner les yeux. Il faut parfois savoir ne pas poser de questions." },
  { name: "Cappuccino Assassino", emoji: "🗡️", anim: "shake",  color: "#b08968", chaos: 4,
    origin: "Italian brainrot",
    desc: "Un ninja dont la tête est une tasse de café. Silencieux, précis, redoutable avant dix heures du matin. N'essaie jamais de lui parler avant son premier espresso." },
  { name: "La Vaca Saturno Saturnita", emoji: "🐄", anim: "spin", color: "#9b5de5", chaos: 5,
    origin: "Italian brainrot",
    desc: "Une vache avec Saturne à la place de la tête, qui court en rond dans l'espace. Elle sait des choses sur l'univers, mais elle ne les dira pas." },
  { name: "Glorbo Fruttodrillo", emoji: "🍉", anim: "float",  color: "#80ed99", chaos: 3,
    origin: "Italian brainrot",
    desc: "Un croisement entre un crocodile et un melon d'eau qui flotte paisiblement dans les marais. Il a l'air gentil, mais il ne ferme jamais l'œil en entier." },
  { name: "Bombombini Gusini", emoji: "🪿", anim: "bounce", color: "#d0f4de", chaos: 4,
    origin: "Italian brainrot",
    desc: "Une oie en armure futuriste qui plane et fait mine de t'inspecter. Ses intentions sont floues, son look est impeccable, et son cri est une alarme incendie." }
];

/* ============================================================
   2. OUTILS DATE  (le brainrot change à minuit, heure locale)
   ============================================================ */
const params = new URLSearchParams(location.search);
// Astuce pour tester : ajoute ?decalage=1 à l'URL pour voir demain, ?decalage=-1 pour hier
const OFFSET = parseInt(params.get("decalage") || "0", 10) || 0;

function dayNumber(date) {
  // nombre de jours depuis 1970, en heure locale
  return Math.floor((Date.UTC(date.getFullYear(), date.getMonth(), date.getDate())) / 86400000);
}

function dateFromDayNumber(n) {
  const d = new Date(n * 86400000);
  return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
}

function keyFor(n) { return "brainrot-note-" + n; }

function pickFor(n) { return BRAINROTS[((n % BRAINROTS.length) + BRAINROTS.length) % BRAINROTS.length]; }

function formatDate(date, long) {
  return date.toLocaleDateString("fr-FR", long
    ? { weekday: "long", day: "numeric", month: "long", year: "numeric" }
    : { weekday: "short", day: "numeric", month: "short" });
}

/* ============================================================
   3. STOCKAGE DES NOTES (localStorage, sécurisé)
   ============================================================ */
function getRating(n) {
  try {
    const v = parseInt(localStorage.getItem(keyFor(n)), 10);
    return v >= 1 && v <= 5 ? v : 0;
  } catch (e) { return 0; }
}

function setRating(n, v) {
  try { localStorage.setItem(keyFor(n), String(v)); } catch (e) { /* stockage indisponible */ }
}

/* ============================================================
   4. AFFICHAGE
   ============================================================ */
const today = dayNumber(new Date()) + OFFSET;
const current = pickFor(today);

const $ = id => document.getElementById(id);
const VERDICTS = [
  "",
  "Aïe. Ce brainrot n'a pas convaincu.",
  "Bof, on a déjà vu mieux.",
  "Correct, ni génial ni honteux.",
  "Très bon, il a du potentiel.",
  "Chef-d'œuvre absolu. Cerveau officiellement fondu."
];

function renderCharacter() {
  $("date").textContent = formatDate(dateFromDayNumber(today), true);
  $("stage").style.setProperty("--stage", current.color);
  const av = $("avatar");
  av.textContent = current.emoji;
  av.className = "avatar a-" + current.anim;
  $("name").textContent = current.name;
  $("origin").textContent = current.origin;
  $("desc").textContent = current.desc;

  const bolts = $("bolts");
  bolts.textContent = "";
  for (let i = 1; i <= 5; i++) {
    const s = document.createElement("span");
    s.textContent = "⚡";
    if (i > current.chaos) s.className = "off";
    bolts.appendChild(s);
  }
  $("bolts").setAttribute("title", current.chaos + " sur 5");
  document.title = current.name + " · Brainrot du jour";
}

function renderStars() {
  const box = $("stars");
  const rating = getRating(today);
  box.textContent = "";
  for (let i = 1; i <= 5; i++) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "star" + (i <= rating ? " on" : "");
    b.textContent = "★";
    b.setAttribute("role", "radio");
    b.setAttribute("aria-checked", String(i === rating));
    b.setAttribute("aria-label", i + " sur 5");
    b.addEventListener("click", () => {
      setRating(today, i);
      renderStars();
      renderHistory();
    });
    box.appendChild(b);
  }
  $("verdict").textContent = rating ? VERDICTS[rating] : "Pas encore noté. À toi de juger !";
}

function renderCountdown() {
  const now = new Date();
  const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
  const ms = midnight - now;
  const h = Math.floor(ms / 3600000);
  const m = Math.floor((ms % 3600000) / 60000);
  $("next").textContent = OFFSET
    ? "Mode test actif (décalage de " + OFFSET + " jour)."
    : "Prochain brainrot dans " + h + " h " + String(m).padStart(2, "0") + " min.";
}

function renderHistory() {
  const list = $("days");
  list.textContent = "";
  let total = 0, count = 0;

  // moyenne sur toutes les notes enregistrées
  for (let i = 0; i < 400; i++) {
    const r = getRating(today - i);
    if (r) { total += r; count++; }
  }
  $("stats").textContent = count
    ? "Tu as noté " + count + " brainrot" + (count > 1 ? "s" : "") + ", avec une moyenne de " + (total / count).toFixed(1).replace(".", ",") + " / 5."
    : "Tu n'as encore noté aucun brainrot.";

  for (let i = 0; i < 7; i++) {
    const n = today - i;
    const b = pickFor(n);
    const r = getRating(n);

    const li = document.createElement("li");
    li.className = "day";

    const e = document.createElement("div"); e.className = "e"; e.textContent = b.emoji;
    const nm = document.createElement("div"); nm.className = "n"; nm.textContent = b.name;
    const d = document.createElement("div"); d.className = "d";
    d.textContent = i === 0 ? "Aujourd'hui" : formatDate(dateFromDayNumber(n), false);
    const rt = document.createElement("div");
    rt.className = "r" + (r ? "" : " none");
    rt.textContent = r ? "★".repeat(r) + "☆".repeat(5 - r) : "Pas noté";
    if (r) rt.setAttribute("aria-label", r + " sur 5");

    li.append(e, nm, d, rt);
    list.appendChild(li);
  }
}

/* Petit effet au clic sur le personnage */
function bindAvatar() {
  const av = $("avatar");
  const react = () => {
    av.classList.remove("pop");
    void av.offsetWidth; // relance l'animation
    av.classList.add("pop");
    setTimeout(() => av.classList.remove("pop"), 520);
  };
  av.addEventListener("click", react);
  av.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); react(); }
  });
}

renderCharacter();
renderStars();
renderHistory();
renderCountdown();
bindAvatar();
setInterval(renderCountdown, 30000);
</script>
</body>
</html>
